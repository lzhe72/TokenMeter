name: TokenMeter internal release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full protected master SHA to build, test and publish
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: tokenmeter-internal-release
  cancel-in-progress: false

env:
  TM_CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    environment: release-validation
    outputs:
      release_id: ${{ steps.context.outputs.release_id }}
      run_id: ${{ steps.context.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify actual protected branch and complete candidate checks
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/internal_publish.py preflight --candidate-sha "$TM_CANDIDATE_SHA" --output .local/internal/control
      - uses: actions/upload-artifact@v4
        with:
          name: release-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/control/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  build:
    name: internal-build
    needs: preflight
    runs-on: macos-15
    environment: release-validation
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Select native toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Verify source baseline and release tools
        run: |
          python3 scripts/check_docs.py --mode baseline
          python3 scripts/quality_gate.py check
          python3 -m unittest discover -s tests/governance -p 'test_*.py' -v
      - name: Create owned build output parent
        run: mkdir -p "$GITHUB_WORKSPACE/.local/internal"
      - name: Build one final universal package and controlled upgrade
        env:
          TM_INTERNAL_P12_BASE64: ${{ secrets.TM_INTERNAL_P12_BASE64 }}
          TM_INTERNAL_P12_PASSWORD: ${{ secrets.TM_INTERNAL_P12_PASSWORD }}
          TM_INTERNAL_ED25519_SEED: ${{ secrets.TM_INTERNAL_ED25519_SEED }}
        run: >-
          python3 scripts/internal_package.py
          --config "releases/${{ needs.preflight.outputs.release_id }}/internal-release.json"
          --output "$GITHUB_WORKSPACE/.local/internal/package"
          --candidate-sha "$TM_CANDIDATE_SHA"
      - name: Preserve original package and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  installed-e2e:
    name: installed-e2e (${{ matrix.arch }})
    needs: [preflight, build]
    environment: release-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Select native toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install fixed server and test dependencies
        run: |
          python3 -m pip install --only-binary=:all: -r server/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: internal-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/package
      - name: Install the original DMG and run all six native cases
        env:
          TM_RELEASE_RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          package = pathlib.Path('.local/internal/package').resolve()
          manifest = json.loads((package/'package-manifest.json').read_text())
          subprocess.run([sys.executable, 'scripts/internal_package_e2e.py',
              '--package-manifest', str(package/'package-manifest.json'),
              '--config', 'releases/${{ needs.preflight.outputs.release_id }}/internal-release.json',
              '--dmg', str(package/manifest['artifacts']['dmg']['path']),
              '--update-zip', str(package/manifest['artifacts']['update_zip']['path']),
              '--output', str(pathlib.Path('.local/internal/evidence/${{ matrix.arch }}').resolve()),
              '--run-id', os.environ['TM_RELEASE_RUN_ID'],
              '--candidate-sha', os.environ['TM_CANDIDATE_SHA']], check=True)
          PY
      - name: Archive complete raw bundles without changing their contents
        if: always()
        run: |
          test -d .local/internal/evidence/${{ matrix.arch }}
          tar -czf ".local/internal/evidence-${{ matrix.arch }}.tar.gz" -C .local/internal/evidence ${{ matrix.arch }}
      - name: Retain raw installation and E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/evidence-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 90

  gate:
    name: internal-gate
    needs: [preflight, build, installed-e2e]
    environment: release-validation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Select original-result parser
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/download-artifact@v4
        with:
          name: internal-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/package
      - uses: actions/download-artifact@v4
        with:
          name: release-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/control
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/downloads
          merge-multiple: true
      - name: Restore both original evidence archives
        run: |
          mkdir -p .local/internal/evidence
          tar -xzf .local/internal/downloads/evidence-arm64.tar.gz -C .local/internal/evidence
          tar -xzf .local/internal/downloads/evidence-x86_64.tar.gz -C .local/internal/evidence
      - name: Reparse raw results and issue a passport only for full PASS
        run: >-
          python3 scripts/internal_release_gate.py
          --package-manifest "$GITHUB_WORKSPACE/.local/internal/package/package-manifest.json"
          --evidence "$GITHUB_WORKSPACE/.local/internal/evidence"
          --protection "$GITHUB_WORKSPACE/.local/internal/control/preflight.json"
          --output "$GITHUB_WORKSPACE/.local/internal/gate"
          --candidate-sha "$TM_CANDIDATE_SHA"
          --run-id "${{ needs.preflight.outputs.run_id }}"
      - name: Preserve final decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/gate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: internal-publish
    needs: [preflight, build, installed-e2e, gate]
    environment: release-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: internal-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/package
      - uses: actions/download-artifact@v4
        with:
          name: internal-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/gate
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/evidence-archives
          merge-multiple: true
      - name: Publish original tested assets and immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/internal_publish.py publish
          --candidate-sha "$TM_CANDIDATE_SHA"
          --package-manifest "$GITHUB_WORKSPACE/.local/internal/package/package-manifest.json"
          --passport "$GITHUB_WORKSPACE/.local/internal/gate/${{ needs.preflight.outputs.release_id }}.passport.json"
          --run-id "${{ needs.preflight.outputs.run_id }}"
          --evidence-archives "$GITHUB_WORKSPACE/.local/internal/evidence-archives"
          --output "$GITHUB_WORKSPACE/.local/internal/publication"
      - name: Preserve remote publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/internal/publication/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
