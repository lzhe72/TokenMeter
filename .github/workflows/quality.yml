name: TokenMeter quality

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked service and test dependencies
        run: |
          python3 -m pip install --only-binary=:all: -r server/requirements-dev.txt
      - name: Validate SOP and document baseline
        run: python3 scripts/check_docs.py
      - name: Validate feature traceability
        run: python3 scripts/quality_gate.py check
      - name: Test governance tooling
        run: python3 -m unittest discover -s tests/governance -p 'test_*.py' -v
      - name: Test real account service and database
        run: python3 -m pytest tests/server -q
      - name: Test isolated update package input validation
        run: python3 -m unittest discover -s apps/macos/tests -p 'test_*.py' -v

  product-e2e:
    name: product-e2e (${{ matrix.runner }})
    needs: governance
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Select the documented native toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install locked service and test dependencies
        run: |
          python3 -m pip install --only-binary=:all: -r server/requirements-dev.txt
      - name: Execute product gate
        # All TM-001 cases in the versioned feature matrix are required; missing native evidence blocks this job.
        run: python3 scripts/quality_gate.py iteration
      - name: Package local-only preview DMG from tested App
        if: ${{ always() && matrix.runner == 'macos-15-intel' }}
        run: |
          set -euo pipefail
          candidate_zip="$(find .local/e2e -path '*/E2E-TM001-001/candidate-app.zip' -print -quit)"
          test -n "$candidate_zip"
          mkdir -p .local/preview/package-source
          ditto -x -k "$candidate_zip" .local/preview/package-source
          python3 scripts/package_preview_dmg.py \
            --app "$PWD/.local/preview/package-source/TokenMeter.app" \
            --output "$PWD/.local/preview/TokenMeter-${{ github.sha }}-local-preview.dmg" \
            --service-url http://127.0.0.1:49176 | tee .local/preview/manifest.json
      - name: Retain local-only preview DMG
        if: ${{ always() && matrix.runner == 'macos-15-intel' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-preview-dmg-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .local/preview/*.dmg
            .local/preview/manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Retain actual gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
